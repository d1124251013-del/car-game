<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>極速閃避｜公路挑戰</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(135deg, #101827, #172b3d);
    color: #fff;
  }

  .game-wrap {
    width: min(94vw, 520px);
    text-align: center;
  }

  h1 {
    margin: 0 0 8px;
    font-size: clamp(26px, 7vw, 38px);
  }

  .subtitle {
    margin: 0 0 14px;
    color: #b9c7d6;
    font-size: 14px;
  }

  .info {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 10px;
  }

  .card {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px;
    padding: 9px 4px;
  }

  .label {
    display: block;
    color: #aebdca;
    font-size: 12px;
  }

  .value {
    display: block;
    margin-top: 2px;
    font-size: 19px;
    font-weight: 700;
  }

  #game {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 5;
    max-height: 650px;
    overflow: hidden;
    border-radius: 18px;
    border: 3px solid rgba(255,255,255,.2);
    background: #252b32;
    box-shadow: 0 16px 45px rgba(0,0,0,.35);
    touch-action: none;
  }

  .road {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg,
        #3b434b 0%,
        #3b434b 8%,
        #242a30 8%,
        #242a30 92%,
        #3b434b 92%,
        #3b434b 100%);
  }

  .lane-line {
    position: absolute;
    top: -120px;
    bottom: -120px;
    width: 7px;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.85) 0 55px,
      transparent 55px 105px
    );
    animation: roadMove .65s linear infinite;
    opacity: .8;
  }

  .lane1 { left: 33.33%; transform: translateX(-50%); }
  .lane2 { left: 66.66%; transform: translateX(-50%); }

  @keyframes roadMove {
    from { transform: translate(-50%, 0); }
    to { transform: translate(-50%, 105px); }
  }

  .side-line {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 5px;
    background: #f2d45c;
  }
  .side-left { left: 8%; }
  .side-right { right: 8%; }

  .car {
    position: absolute;
    width: 16%;
    max-width: 72px;
    min-width: 46px;
    aspect-ratio: 0.55;
    border-radius: 14px 14px 10px 10px;
    z-index: 5;
  }

  .car::before {
    content: "";
    position: absolute;
    left: 15%;
    right: 15%;
    top: 12%;
    height: 31%;
    border-radius: 8px;
    background: rgba(210,235,255,.8);
  }

  .car::after {
    content: "";
    position: absolute;
    left: -9%;
    right: -9%;
    bottom: 12%;
    height: 18%;
    border-radius: 5px;
    background:
      linear-gradient(90deg, #171717 0 18%, transparent 18% 82%, #171717 82% 100%);
  }

  #player {
    bottom: 7%;
    left: 50%;
    transform: translateX(-50%);
    background: #e74c3c;
    box-shadow: 0 7px 15px rgba(0,0,0,.35);
  }

  .enemy { top: -100px; }

  .enemy.red { background: #e74c3c; }
  .enemy.blue { background: #3498db; }
  .enemy.yellow { background: #f1c40f; }
  .enemy.green { background: #2ecc71; }
  .enemy.purple { background: #9b59b6; }

  .overlay {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 24px;
    background: rgba(7,12,18,.82);
    backdrop-filter: blur(4px);
  }

  .overlay.hidden { display: none; }

  .overlay h2 {
    margin: 0 0 10px;
    font-size: 30px;
  }

  .overlay p {
    margin: 5px 0;
    color: #d6e0e8;
  }

  button {
    border: 0;
    border-radius: 12px;
    padding: 13px 24px;
    margin-top: 16px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    color: #fff;
    background: #e74c3c;
    transition: transform .15s, opacity .15s;
  }

  button:hover { transform: translateY(-2px); }
  button:active { transform: translateY(0); }

  .controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 12px;
  }

  .control-btn {
    width: 78px;
    height: 50px;
    padding: 0;
    margin: 0;
    font-size: 24px;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.15);
    touch-action: manipulation;
  }

  .tip {
    margin-top: 10px;
    color: #9fb0be;
    font-size: 13px;
  }

  .flash {
    position: absolute;
    inset: 0;
    z-index: 15;
    pointer-events: none;
    background: rgba(255,60,60,.35);
    opacity: 0;
  }

  .flash.show {
    animation: hit .25s ease-out;
  }

  @keyframes hit {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }
</style>
</head>

<body>
<div class="game-wrap">
  <h1>🚗 極速閃避</h1>
  <p class="subtitle">公路挑戰｜躲開其他車輛，看看你能拿幾分！</p>

  <div class="info">
    <div class="card">
      <span class="label">目前分數</span>
      <span class="value" id="score">0</span>
    </div>
    <div class="card">
      <span class="label">生命</span>
      <span class="value" id="lives">❤️❤️❤️</span>
    </div>
    <div class="card">
      <span class="label">最高分</span>
      <span class="value" id="highScore">0</span>
    </div>
  </div>

  <div id="game">
    <div class="road"></div>
    <div class="side-line side-left"></div>
    <div class="side-line side-right"></div>
    <div class="lane-line lane1"></div>
    <div class="lane-line lane2"></div>

    <div id="player" class="car"></div>
    <div class="flash" id="flash"></div>

    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">準備好了嗎？</h2>
      <p id="overlayText">使用 ← → 或下方按鈕控制汽車</p>
      <button id="startBtn">開始遊戲</button>
    </div>
  </div>

  <div class="controls">
    <button class="control-btn" id="leftBtn" type="button">←</button>
    <button class="control-btn" id="rightBtn" type="button">→</button>
  </div>

  <div class="tip">電腦可使用鍵盤 ← →；手機可直接點擊方向按鈕。</div>
</div>

<script>
(() => {
  const game = document.getElementById("game");
  const player = document.getElementById("player");
  const scoreEl = document.getElementById("score");
  const livesEl = document.getElementById("lives");
  const highScoreEl = document.getElementById("highScore");
  const overlay = document.getElementById("overlay");
  const overlayTitle = document.getElementById("overlayTitle");
  const overlayText = document.getElementById("overlayText");
  const startBtn = document.getElementById("startBtn");
  const leftBtn = document.getElementById("leftBtn");
  const rightBtn = document.getElementById("rightBtn");
  const flash = document.getElementById("flash");

  let running = false;
  let score = 0;
  let lives = 3;
  let highScore = 0;
  let playerX = 50;
  let enemies = [];
  let lastTime = 0;
  let spawnTimer = 0;
  let scoreTimer = 0;
  let difficulty = 1;
  let animationId = null;

  const colors = ["red", "blue", "yellow", "green", "purple"];

  function resetGame() {
    enemies.forEach(e => e.el.remove());
    enemies = [];
    score = 0;
    lives = 3;
    playerX = 50;
    difficulty = 1;
    spawnTimer = 0;
    scoreTimer = 0;
    player.style.left = playerX + "%";
    updateUI();
  }

  function updateUI() {
    scoreEl.textContent = score;
    livesEl.textContent = "❤️".repeat(lives) + "🖤".repeat(3 - lives);
    highScoreEl.textContent = highScore;
  }

  function movePlayer(direction) {
    if (!running) return;
    playerX += direction * 8;
    playerX = Math.max(14, Math.min(86, playerX));
    player.style.left = playerX + "%";
  }

  function spawnEnemy() {
    const el = document.createElement("div");
    const color = colors[Math.floor(Math.random() * colors.length)];
    el.className = "car enemy " + color;

    // 避免障礙車一開始總是出現在同一條路線
    const lanePositions = [20, 36.5, 53.5, 70, 84];
    const x = lanePositions[Math.floor(Math.random() * lanePositions.length)];

    el.style.left = x + "%";
    game.appendChild(el);

    enemies.push({
      el,
      x,
      y: -15,
      speed: 20 + difficulty * 7 + Math.random() * 8
    });
  }

  function isColliding(a, b) {
    const ar = a.getBoundingClientRect();
    const br = b.getBoundingClientRect();

    return !(
      ar.right < br.left + 8 ||
      ar.left + 8 > br.right ||
      ar.bottom < br.top + 8 ||
      ar.top + 8 > br.bottom
    );
  }

  function hitEnemy(enemy) {
    enemy.el.remove();
    enemies = enemies.filter(e => e !== enemy);
    lives--;
    flash.classList.remove("show");
    void flash.offsetWidth;
    flash.classList.add("show");
    updateUI();

    if (lives <= 0) {
      endGame();
    }
  }

  function endGame() {
    running = false;
    cancelAnimationFrame(animationId);

    if (score > highScore) {
      highScore = score;
    }

    updateUI();
    overlayTitle.textContent = "遊戲結束！";
    overlayText.textContent = "你的分數：" + score + "　最高分：" + highScore;
    startBtn.textContent = "再玩一次";
    overlay.classList.remove("hidden");
  }

  function gameLoop(timestamp) {
    if (!running) return;

    const delta = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    spawnTimer += delta;
    scoreTimer += delta;

    // 每隔一段時間增加難度
    difficulty = 1 + Math.floor(score / 10) * 0.35;

    const spawnInterval = Math.max(0.42, 1.05 - difficulty * 0.08);
    if (spawnTimer >= spawnInterval) {
      spawnEnemy();
      spawnTimer = 0;
    }

    // 存活就持續加分
    if (scoreTimer >= 0.7) {
      score++;
      scoreTimer = 0;
      updateUI();
    }

    for (const enemy of [...enemies]) {
      enemy.y += enemy.speed * delta;
      enemy.el.style.top = enemy.y + "%";

      if (enemy.y > 110) {
        enemy.el.remove();
        enemies = enemies.filter(e => e !== enemy);
        continue;
      }

      if (isColliding(player, enemy.el)) {
        hitEnemy(enemy);
        if (!running) break;
      }
    }

    animationId = requestAnimationFrame(gameLoop);
  }

  function startGame() {
    resetGame();
    overlay.classList.add("hidden");
    running = true;
    lastTime = performance.now();
    animationId = requestAnimationFrame(gameLoop);
  }

  document.addEventListener("keydown", (event) => {
    if (event.key === "ArrowLeft") {
      event.preventDefault();
      movePlayer(-1);
    } else if (event.key === "ArrowRight") {
      event.preventDefault();
      movePlayer(1);
    } else if (event.key === " " && !running) {
      event.preventDefault();
      startGame();
    }
  });

  leftBtn.addEventListener("pointerdown", () => movePlayer(-1));
  rightBtn.addEventListener("pointerdown", () => movePlayer(1));
  startBtn.addEventListener("click", startGame);

  updateUI();
})();
</script>
</body>
</html>
